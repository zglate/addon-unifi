# Served on the ingress port when the 'ingress' add-on option is off.
# Keeps the sidebar panel from showing a broken iframe and explains how to
# turn inline mode on.
server {
    listen 8099;
    allow 172.30.32.2;
    deny all;

    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>UniFi</title><style>body{font-family:sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#222;line-height:1.5}code{background:#eee;padding:.1rem .3rem;border-radius:3px}</style></head><body><h2>Inline UniFi is turned off</h2><p>This sidebar panel renders the UniFi Network Application directly inside Home Assistant, but it is disabled by default.</p><p>To turn it on, open this add-on&#39;s <b>Configuration</b> tab, enable the <code>ingress</code> option, and restart the add-on.</p><p>You can always reach UniFi via the <b>Open Web UI</b> button on the add-on&#39;s Info tab.</p></body></html>';
    }
}
