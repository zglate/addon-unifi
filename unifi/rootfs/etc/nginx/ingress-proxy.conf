# HA ingress reverse proxy for the UniFi Network Application UI.
#
# Why this exists: the UniFi SPA hardcodes that it lives at the web root
# (`<base href="/manage/">`, API at `/`, router basename `/manage`, WebSockets
# at `/wss/...`). HA ingress serves the add-on under a stripped path prefix
# (`/api/hassio_ingress/<token>/`) and over plain HTTP, while UniFi is HTTPS
# only on 8443. Upstream declared inline ingress impossible for these reasons.
#
# The whole UI stack funnels its base path through a small set of *content*
# literals (stable across the per-release bundle-hash renames). Rewriting those
# literals to carry the live ingress prefix (the X-Ingress-Path header HA
# injects on every request) lets the UI run correctly behind the prefix. The
# prefix is dynamic per session, so the rewrite is done here at request time
# rather than baked into the files at build time.
server {
    listen 8099;

    # Ingress traffic only ever arrives from the Supervisor.
    allow 172.30.32.2;
    deny all;

    location / {
        # HA strips the ingress prefix before forwarding, so the back end is
        # addressed at root. UniFi is HTTPS-only with a self-signed cert.
        proxy_pass https://127.0.0.1:8443/;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # UniFi rejects POSTs whose Origin/Referer don't match its own
        # scheme/host/port (CSRF guard). The proxy changes both, so strip them;
        # the csrf_token cookie/header pair still provides CSRF cover.
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # Forward only UniFi's own cookies (see the maps in nginx.conf). This
        # drops the Home Assistant cookies the browser also sends to this
        # same-origin path, keeping the request under UniFi's Jetty 8 KB header
        # limit so it does not answer 400 Bad Request.
        proxy_set_header Cookie "$unifi_c_session; $unifi_c_csrf";

        # Cloudflare (Access / Tunnel) in front of Home Assistant injects large
        # request headers UniFi has no use for, the Cf-Access-Jwt-Assertion JWT
        # in particular can run to several KB. Left in place they count toward
        # UniFi's 8 KB header limit and trip the same 400. Drop them all.
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Cf-Access-Authenticated-User-Id "";
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Cf-Ipcountry "";
        proxy_set_header Cf-Ray "";
        proxy_set_header Cf-Visitor "";
        proxy_set_header Cf-Worker "";
        proxy_set_header Cf-Warp-Tag-Id "";
        proxy_set_header Cdn-Loop "";

        # sub_filter only rewrites uncompressed responses.
        proxy_set_header Accept-Encoding "";

        # UniFi sends HSTS, which would poison the HA origin and force-upgrade
        # it to https on a port where nothing listens.
        proxy_hide_header Strict-Transport-Security;

        # The app emits root-relative redirects (e.g. /manage/account/login).
        # Keep Location relative and re-prefix it so the browser stays inside
        # the ingress path instead of escaping it.
        absolute_redirect off;
        proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;

        # 1. Static asset anchor (index.html)
        sub_filter '<base href="/manage/">' '<base href="$http_x_ingress_path/manage/">';
        # 2. SPA constant consumed by the chunk loader (angular index.js)
        sub_filter 'BASE_HREF:"/manage/"' 'BASE_HREF:"$http_x_ingress_path/manage/"';
        # 3. API adapter root: XHR and WebSocket URLs derive from this (index.js)
        sub_filter 'apiAdapter:new i.default("/")' 'apiAdapter:new i.default("$http_x_ingress_path/")';
        # 4. Router basename: in standalone+local mode swai hardcodes
        #    a.baseUrl="/manage/", which becomes the React Router basename.
        #    Carry the full ingress path so the router resolves "/" correctly.
        sub_filter 'baseUrl="/manage/"' 'baseUrl="$http_x_ingress_path/manage/"';
        # 5. Setup wizard (separate mini-app with its own absolute paths)
        sub_filter '<base href="/setup/"/>' '<base href="$http_x_ingress_path/setup/"/>';
        sub_filter 'href="/setup/' 'href="$http_x_ingress_path/setup/';
        sub_filter 'src="/setup/' 'src="$http_x_ingress_path/setup/';
        # 6. Setup wizard API client (single axios instance in main.js)
        sub_filter 'baseURL:"/",withCredentials' 'baseURL:"$http_x_ingress_path/",withCredentials';
    }
}
