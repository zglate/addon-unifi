# Minimal nginx for HA ingress. The init-unifi service symlinks one of the
# ingress-*.conf server blocks to active-server.conf based on the 'ingress'
# add-on option, then this file includes it.
daemon off;
user root;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    error_log /dev/stderr warn;

    # Required so the proxied WebSocket upgrade is forwarded correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_max_body_size 0;
    proxy_buffering off;

    include /etc/nginx/active-server.conf;
}
